name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 默认最小权限：构建任务只需要读代码。
# 发布任务单独申请 contents: write —— 见下面的 release job。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.signing.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (only if secrets are present)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置正式签名密钥，release 包会用 debug 签名，**不能发给用户**。"
            exit 0
          fi

          # 从 secret 里粘贴过来的 base64 常带换行/回车/空格（在 Windows 上生成的尤其如此），
          # 先全清掉再解码，否则解出来的是坏文件。
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.jks
          if [ ! -s release.jks ]; then
            echo "::error::KEYSTORE_BASE64 解码后是空文件。secret 里应该是一整行 base64（base64 -w0 的输出）。"
            exit 1
          fi

          # 直接让 keytool 打开它 —— 比猜文件头的魔数靠谱得多，而且一次把
          # "文件对不对""密码对不对""别名在不在"全验完。
          #
          # 曾经这里写的是 `head -c 4 | xxd | grep '^feedfeed$'`（JKS 的魔数），
          # 结果把好密钥判成了坏的：JDK 9 起 keytool **默认生成 PKCS12**，
          # 本项目这个 zhizhi-release.jks 就是 PKCS12（开头是 3082…不是 feedfeed）。
          # 扩展名和真实格式对不上是很常见的，所以不要靠扩展名或魔数判断。
          loaded=""
          for extra in "" "-storetype PKCS12" "-storetype JKS"; do
            if keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" $extra > /tmp/ks.txt 2>&1; then
              loaded="$extra"
              break
            fi
          done
          if [ -z "$loaded" ] && ! grep -q "Keystore type" /tmp/ks.txt 2>/dev/null; then
            cat /tmp/ks.txt || true
            echo "::error::打不开这个 keystore：base64 内容不对，或 KEYSTORE_PASSWORD 不对。"
            exit 1
          fi
          grep -E "Keystore type|Your keystore contains" /tmp/ks.txt || true
          if [ -n "$KEY_ALIAS" ] && ! grep -q -- "$KEY_ALIAS" /tmp/ks.txt; then
            cat /tmp/ks.txt
            echo "::error::这个 keystore 里没有别名 $KEY_ALIAS（KEY_ALIAS 填错了？）。"
            exit 1
          fi
          # 把真实类型读出来交给 Gradle，免得到别处再猜一遍
          KSTYPE=$(grep "Keystore type" /tmp/ks.txt | sed 's/.*: *//' | tr -d '\r')
          echo "密钥库类型：$KSTYPE"

          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeType=$KSTYPE
          EOF
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Assemble release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lint
        continue-on-error: true

      - name: 守门 1／APK 不得声明 INTERNET 权限
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "checking $APK"
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump permissions "$APK" |
            tee /tmp/perms.txt || \
          "$ANDROID_HOME"/build-tools/35.0.0/aapt dump permissions "$APK" > /tmp/perms.txt
          cat /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
            echo "::error::APK 声明了 INTERNET 权限，这违反了本项目的隐私约束"
            exit 1
          fi

      - name: 记录签名信息（发布任务据此判断）
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" |
            tee /tmp/certs.txt
          mkdir -p dist
          cp "$APK" dist/app-release.apk
          cp /tmp/certs.txt dist/SIGNER.txt

      - name: 守门 2／配了密钥就不能签成 debug
        if: steps.signing.outputs.has_key == 'true'
        run: |
          set -e
          if grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::release APK 用的是 debug 签名。检查 KEYSTORE_BASE64 等 secrets 是否正确。"
            exit 1
          fi
          echo "签名密钥看起来正常。"

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zhizhi-release-apk
          path: dist/
          if-no-files-found: error

      - name: Upload debug APK（仅供自测，不发布）
        uses: actions/upload-artifact@v4
        with:
          name: zhizhi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 单独一个 job 申请写权限：只有打 tag 时才跑，而且必须先通过上面的构建与守门。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 守门 3／没有正式密钥就不许发 Release
        if: needs.build.outputs.has_key != 'true'
        run: |
          echo "::error::仓库没有配置正式签名密钥（KEYSTORE_BASE64 等 secrets）。"
          echo "::error::现在发出去的就是 debug 签名的包 —— 装了它的用户以后无法升级到正式版。"
          echo "::error::要么在 Settings → Secrets and variables → Actions 里配好那四个 secret，"
          echo "::error::要么把本地用正式密钥签好的 APK 手动拖到 Release 上。"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: zhizhi-release-apk

      - name: 签名信息 + 规范化文件名
        run: |
          set -e
          cat SIGNER.txt
          if grep -q 'CN=Android Debug' SIGNER.txt; then
            echo "::error::这个包是 debug 签名的，拒绝发布。"
            exit 1
          fi
          VER="${GITHUB_REF_NAME#v}"
          mv app-release.apk "ZhiZhi-${VER}-release.apk"
          echo "ASSET=ZhiZhi-${VER}-release.apk" >> "$GITHUB_ENV"

      # 用 gh 而不是第三方 action：gh 在 runner 上自带，
      # 而且第三方 action 往刚建出来的 Release 上挂资产时会撞上
      # "Not Found - update-a-release-asset" 的竞态。
      - name: 创建或更新 Release
        env:
          # 这个 job **没有 checkout**，工作目录里没有 .git，gh 没法从 git remote 推断仓库，
          # 会直接 "failed to run git: fatal: not a git repository" 然后退出码 1。
          # （本地复现过：只加 GH_REPO，错误就从 git 推断失败变成 401，说明仓库已定位。）
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          echo "仓库=$GH_REPO  标签=$TAG"
          gh --version | head -1
          if [ -z "${ASSET:-}" ]; then
            echo "::error::没拿到附件名——上一步写 GITHUB_ENV 没生效？当前目录："
            ls -la
            exit 1
          fi
          echo "附件=$ASSET"
          ls -la

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件。"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "知止 ${TAG#v}" \
              --generate-notes
          fi

          echo "---- Release 附件 ----"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) 字节"'
